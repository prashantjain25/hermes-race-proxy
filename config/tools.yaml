# tools.yaml -- SINGLE source of truth for hermes tool provisioning.
# -----------------------------------------------------------------------------
# Read by tool-trim.sh (the only lever). There is no separate allowlist or gate
# file -- this YAML is the one policy. Every toolset is under one category block
# (builtin / plugin / mcp) keyed by HERMES'S REAL toolset names (see
# `hermes tools list`). Inside a block, any server/tool can be added or removed;
# `state` is the only enable/disable switch per entry.
#
# What tool-trim.sh does with it, per launch:
#   base = live enabled toolsets from `hermes tools list` (so load-bearing
#          built-ins are never dropped)
#   override: every row with state: ON is forced IN to the -t union, every
#             row with state: OFF is forced OUT.
#   mcp:      rows under the `mcp` block additionally drive
#             config.yaml's mcp_servers.<name>.enabled (ON -> true, OFF -> false)
#             merging .env/allowable-server auto-connect.
#
# `-t` is EXCLUSIVE, so the union always starts from the live base. Only rows
# with state: ON ever reach -t. Non-CLI / composite / reference toolsets are
# listed in the `reference` block and are never ON by default.
#
# PER-ENTRY FIELDS
#   -t        for builtin/plugin: the hermes toolset name (== the key).
#             for MCP: the SERVER name (e.g. exa) -- on this install `-t exa`
#             works and `-t mcp-exa` does NOT (verified by request tokens).
#   state     ON = force in; OFF = never in -t.
#   tools     the REAL tool names hermes registers. Built-ins are verbatim;
#             MCP tools use the mcp__<server>__<tool> prefix. Reference only.
#   category  optional display grouping (not load-bearing).
# =============================================================================

toolsets:
  # ---- Built-in toolsets (hermes tools list: "Built-in toolsets (cli)") ----
  builtin:
    # Web Search & Retrieval
    web:            { state: OFF, tools: [web_search, web_extract] }
    search:         { state: OFF, tools: [web_search] }
    x_search:       { state: OFF, tools: [x_search] }
    # Browser & Navigation
    browser:        { state: ON,  tools: [browser_navigate, browser_back, browser_click, browser_console, browser_get_images, browser_press, browser_scroll, browser_snapshot, browser_type, browser_vision, browser_cdp, browser_dialog] }
    # Dev & Execution
    terminal:       { state: ON,  tools: [terminal, process] }
    file:           { state: ON,  tools: [read_file, write_file, patch, search_files] }
    code_execution: { state: ON,  tools: [execute_code] }
    # Knowledge & Memory
    memory:         { state: ON,  tools: [memory] }
    context_engine: { state: OFF, tools: [] }
    session_search: { state: ON,  tools: [session_search] }
    skills:         { state: ON,  tools: [skill_view, skill_manage, skills_list] }
    # Tasks & Workflow
    todo:           { state: ON,  tools: [todo] }
    clarify:        { state: ON,  tools: [clarify] }
    delegation:     { state: ON,  tools: [delegate_task] }
    cronjob:        { state: ON,  tools: [cronjob] }
    # Media, Vision & Generation
    vision:         { state: OFF, tools: [vision_analyze] }
    video:          { state: OFF, tools: [video_analyze] }
    image_gen:      { state: OFF, tools: [image_generate] }
    video_gen:      { state: OFF, tools: [video_generate, xai_video_edit, xai_video_extend] }
    # Speech
    tts:            { state: OFF, tools: [text_to_speech] }
    stt:            { state: OFF, tools: [] }
    # Smart Home & Desktop
    homeassistant:  { state: OFF, tools: [ha_call_service, ha_get_state, ha_list_entities, ha_list_services] }
    computer_use:   { state: OFF, tools: [computer_use] }

  # ---- Plugin toolsets (hermes tools list: "Plugin toolsets (cli)") ----
  plugin:
    a2a:            { state: OFF, tools: [] }

  # ---- MCP servers (hermes tools list: "MCP servers"; -t = server name) ----
  # state here drives BOTH -t inclusion AND config.yaml mcp_servers.<name>.enabled
  mcp:
    exa:            { state: ON,  tools: [mcp__exa__web_search_exa, mcp__exa__web_fetch_exa, mcp__exa__get_prompt, mcp__exa__list_prompts, mcp__exa__list_resources, mcp__exa__read_resource] }
    gemini-image:   { state: OFF, tools: [mcp__gemini_image__generate_image, mcp__gemini_image__edit_image, mcp__gemini_image__list_models, mcp__gemini_image__get_prompt, mcp__gemini_image__list_prompts, mcp__gemini_image__list_resources, mcp__gemini_image__read_resource] }
    nimble:         { state: ON,  tools: [mcp__nimble__nimble_search, mcp__nimble__nimble_extract, mcp__nimble__nimble_extract_async, mcp__nimble__nimble_extract_templates_generate, mcp__nimble__nimble_extract_templates_generation_status, mcp__nimble__nimble_extract_templates_get, mcp__nimble__nimble_extract_templates_list, mcp__nimble__nimble_extract_templates_run, mcp__nimble__nimble_extract_templates_run_async, mcp__nimble__nimble_extract_templates_update_from_template, mcp__nimble__nimble_map, mcp__nimble__nimble_crawl_list, mcp__nimble__nimble_crawl_run, mcp__nimble__nimble_crawl_status, mcp__nimble__nimble_crawl_terminate, mcp__nimble__nimble_agents_get, mcp__nimble__nimble_agents_list, mcp__nimble__nimble_agents_create, mcp__nimble__nimble_agents_update, mcp__nimble__nimble_agents_delete, mcp__nimble__nimble_agents_run, mcp__nimble__nimble_agents_run_status, mcp__nimble__nimble_agents_run_result, mcp__nimble__nimble_agents_runs_list, mcp__nimble__nimble_agent_templates_list, mcp__nimble__nimble_agent_templates_get, mcp__nimble__nimble_task_results, mcp__nimble__read_resource, mcp__nimble__get_prompt, mcp__nimble__list_prompts, mcp__nimble__list_resources] }

# ---- Reference: non-CLI / composite / opt-in toolsets (never ON by default) --
# Listed for documentation and one-shot opt-in. Do not edit these to ON unless
# you intend the whole bundle they pull in.
reference:
  safe:       { tools: [image_generate, vision_analyze, web_extract, web_search] }
  debugging:  { tools: [file, terminal, web] }
  coding:     { tools: [file, terminal, search, web, skills, browser, todo, memory, session_search, clarify, code_execution, delegation, vision] }
  kanban:     { tools: [kanban_attach, kanban_attach_url, kanban_attachments, kanban_block, kanban_comment, kanban_complete, kanban_create, kanban_heartbeat, kanban_link, kanban_list, kanban_request_changes, kanban_request_review, kanban_show, kanban_unblock] }
  project:    { tools: [project_create, project_list, project_switch] }
  desktop_ui: { tools: [annotate_preview, close_preview, close_terminal, drive_preview, focus_pane, open_preview, react_to_message, read_preview, read_terminal, read_window_below, tour, tip] }
  discord:    { tools: [discord] }
  discord_admin: { tools: [discord_admin] }
  feishu_doc: { tools: [feishu_doc_read] }
  feishu_drive: { tools: [feishu_drive_add_comment, feishu_drive_list_comments, feishu_drive_list_comment_replies, feishu_drive_reply_comment] }
  spotify:    { tools: [spotify_albums, spotify_devices, spotify_library, spotify_playback, spotify_playlists, spotify_queue, spotify_search] }
  yuanbao:    { tools: [yb_query_group_info, yb_query_group_members, yb_search_sticker, yb_send_dm, yb_send_sticker] }
  messaging:  { tools: [] }